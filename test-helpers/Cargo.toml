[package]
name = "test-helpers"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = "0.11.8"
log = "0.4.27"
http-body-util = "0.1"
anyhow = "1.0.98"
hyper = {version = "1.7.0", features = ["server", "http1"]}
bytes = "1.10.1"
serde = {version = "1.0.219", features = ["derive"]}
tokio = {version = "1.47.1", features = ["rt", "rt-multi-thread", "net", "macros", "io-util"]}
hyper-util = {version = "0.1.16", features = ["tokio"]}
serde_json = "1.0.143"
httparse = "1.10.1"


