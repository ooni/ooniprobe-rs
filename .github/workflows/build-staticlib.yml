name: Build Static Library Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/musl
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
            packages: ""
            cc: gcc
            cxx: g++
          - arch: aarch64
            rust-target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            cxx: aarch64-linux-gnu-g++
          - arch: arm
            rust-target: arm-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
          - arch: x86
            rust-target: i686-unknown-linux-gnu
            packages: gcc-multilib g++-multilib
            cc: gcc
            cxx: g++
            cflags: -m32

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - run: rustup update stable

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ${{ matrix.packages }}

      - name: Configure linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.${{ matrix.rust-target }}]
          linker = "${{ matrix.cc }}"
          EOF

      - name: Build ${{ matrix.arch }} bundle
        run: make staticlib-linux-${{ matrix.arch }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-linux-${{ matrix.arch }}
          path: target/lib

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust-target: x86_64-apple-darwin
          - arch: aarch64
            rust-target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - run: rustup update stable

      - name: Build ${{ matrix.arch }} bundle
        run: make staticlib-macos-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-macos-${{ matrix.arch }}
          path: target/lib

  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust-target: x86_64-pc-windows-gnu
            msystem: MINGW64
            mingw-pkg: mingw-w64-x86_64-gcc
          - arch: x86
            rust-target: i686-pc-windows-gnu
            msystem: MINGW32
            mingw-pkg: mingw-w64-i686-gcc
            long-double-flags: -mlong-double-64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - run: rustup update stable

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: >-
            make
            ${{ matrix.mingw-pkg }}

      - name: Build ${{ matrix.arch }} bundle
        shell: msys2 {0}
        run: make staticlib-windows-${{ matrix.arch }}
        env:
          CFLAGS: ${{ matrix.long-double-flags }}
          CXXFLAGS: ${{ matrix.long-double-flags }}
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.long-double-flags }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-windows-${{ matrix.arch }}
          path: target/lib

  build-linux-musl:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust-target: x86_64-unknown-linux-musl
            toolchain: x86_64-linux-musl-cross
            cc: x86_64-linux-musl-gcc
            cxx: x86_64-linux-musl-g++
          - arch: aarch64
            rust-target: aarch64-unknown-linux-musl
            toolchain: aarch64-linux-musl-cross
            cc: aarch64-linux-musl-gcc
            cxx: aarch64-linux-musl-g++
          - arch: arm
            rust-target: arm-unknown-linux-musleabihf
            toolchain: arm-linux-musleabihf-cross
            cc: arm-linux-musleabihf-gcc
            cxx: arm-linux-musleabihf-g++
          - arch: x86
            rust-target: i686-unknown-linux-musl
            toolchain: i686-linux-musl-cross
            cc: i686-linux-musl-gcc
            cxx: i686-linux-musl-g++

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - run: rustup update stable

      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          curl -fsSL "https://musl.cc/${{ matrix.toolchain }}.tgz" | sudo tar -xz -C /opt
          echo "/opt/${{ matrix.toolchain }}/bin" >> "$GITHUB_PATH"

      - name: Configure linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.${{ matrix.rust-target }}]
          linker = "${{ matrix.cc }}"
          EOF

      - name: Build ${{ matrix.arch }} bundle
        run: make staticlib-musl-${{ matrix.arch }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-linux-musl-${{ matrix.arch }}
          path: target/lib

  bundle:
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-musl, build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          merge-multiple: true
          path: target/lib

      - name: Create static library bundle
        run: tar -czf target/staticlib.tar.gz -C target lib

      - name: Upload combined bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ooniprobe-ffi-staticlib
          path: target/staticlib.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" target/staticlib.tar.gz --clobber
