name: Build test helpers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - run: rustup update stable

      - name: Build echo test helper
        run: cargo build --release --bin ooechohelpd

      - name: Build json test helper
        run: cargo build --release --bin oojsonhelpd

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: ooechohelpd
          path: test-helpers/ooechohelpd

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: test-helpers
          path: |
            target/release/ooechohelpd
            target/release/oojsonhelpd

      - name: Publish to GitHub release
        run: ./script/ghpublish.bash target/release/ooechohelpd target/release/oojsonhelpd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
